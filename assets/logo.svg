<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 204" role="img" aria-label="Yellfie logo: a camera whose lens is a yelling face" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Yellfie</title>
  <!-- sound waves -->
  <g fill="none" stroke-linecap="round">
    <path d="M223 72 A78 78 0 0 1 223 156" stroke="#1A1033" stroke-width="17"/>
    <path d="M223 72 A78 78 0 0 1 223 156" stroke="#FFD23F" stroke-width="8"/>
    <path d="M245 58 A100 100 0 0 1 245 170" stroke="#1A1033" stroke-width="17"/>
    <path d="M245 58 A100 100 0 0 1 245 170" stroke="#3DF5C4" stroke-width="8"/>
  </g>
  <!-- body shadow -->
  <rect x="30" y="60" width="184" height="128" rx="34" fill="#1A1033"/>
  <!-- viewfinder bump -->
  <rect x="58" y="32" width="66" height="36" rx="12" fill="#FFD23F" stroke="#1A1033" stroke-width="7"/>
  <!-- body -->
  <rect x="20" y="50" width="184" height="128" rx="34" fill="#FF2E88" stroke="#1A1033" stroke-width="7"/>
  <path d="M40 72 q14 -10 34 -10" fill="none" stroke="#FFF6E8" stroke-width="6" stroke-linecap="round" opacity=".55"/>
  <!-- flash -->
  <circle cx="174" cy="80" r="11" fill="#3DF5C4" stroke="#1A1033" stroke-width="6"/>
  <!-- lens -->
  <circle cx="106" cy="116" r="51" fill="#FFF6E8" stroke="#1A1033" stroke-width="7"/>
  <circle cx="106" cy="116" r="37" fill="#FFD23F" stroke="#1A1033" stroke-width="6"/>
  <!-- squeezed eyes -->
  <g fill="none" stroke="#1A1033" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 99 l11 6.5 l-11 6.5"/>
    <path d="M126 99 l-11 6.5 l11 6.5"/>
  </g>
  <!-- yelling mouth -->
  <ellipse cx="106" cy="131" rx="14" ry="15" fill="#1A1033"/>
  <path d="M95.5 138 q10.5 -8 21 0 q-3 6 -10.5 6.5 q-7.5 -.5 -10.5 -6.5z" fill="#FF4D5E"/>
  <!-- sparkle -->
  <path d="M30 10 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5z" fill="#3DF5C4" stroke="#1A1033" stroke-width="5" stroke-linejoin="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
